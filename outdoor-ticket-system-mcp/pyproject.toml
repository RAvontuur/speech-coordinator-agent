[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outdoor-ticket-system-mcp"
version = "0.1.0"
description = "File-backed local ticket and coding prompt queue MCP server"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0,<2", "PyYAML>=6.0"]

[project.scripts]
outdoor-ticket-system-mcp = "outdoor_ticket_system_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]